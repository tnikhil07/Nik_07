<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Nikhilji Background Experiment</title>
<link rel="stylesheet" href="background-experiment.css">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;color:#243447;min-height:100vh}
.preview{max-width:1000px;margin:auto;padding:70px 8%}
.hero{background:linear-gradient(135deg,#0b1f3a,#164b78);color:white;border-radius:18px;padding:45px;margin-bottom:28px}
h1{font-size:42px;margin:0 0 10px}
p{line-height:1.7}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.card{padding:28px;border:1px solid #e8edf2;border-radius:14px;box-shadow:0 8px 30px rgba(11,31,58,.07)}
@media(max-width:700px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="preview">
  <div class="hero">
    <h1>Nikhilji Thakor</h1>
    <p>Background Experiment — Finance & HR Portfolio</p>
  </div>
  <div class="grid">
    <div class="card"><h3>Professional</h3><p>Subtle blue corporate atmosphere.</p></div>
    <div class="card"><h3>Finance Feel</h3><p>Very light grid pattern suggests data and structure.</p></div>
    <div class="card"><h3>Clean</h3><p>Existing cards remain bright and readable.</p></div>
  </div>
</div>
</body>
</html>
